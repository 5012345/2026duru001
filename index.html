<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE BREAKER - ANTI-AI EDITION</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #050508;
            color: #00ff9d;
            margin: 0;
            overflow-x: hidden;
            
            /* 1. 부정행위 방지 CSS: 텍스트 선택 및 드래그 금지 */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            
            /* 1. 부정행위 방지 CSS: 모바일 길게 누르기 메뉴 비활성화 */
            -webkit-touch-callout: none;
        }

        .hacker-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&q=80&w=2070');
            background-size: cover; background-position: center; z-index: -1;
        }

        .cyber-panel {
            background: rgba(10, 10, 20, 0.95);
            border: 2px solid #00ff9d;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* ANTI-AI CSS Obfuscation */
        .obf-container { display: inline-flex; flex-wrap: wrap; justify-content: center; }
        .obf-char { position: relative; display: inline-block; min-width: 0.5em; }
        .obf-char::after { content: attr(data-v); position: relative; }
        .noise { position: absolute; opacity: 0.01; font-size: 1px; pointer-events: none; }

        .btn-action {
            transition: all 0.2s ease;
            background: #00ff9d; color: #050508; font-weight: bold;
        }

        .btn-action:hover {
            background: #05d684; transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 157, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05); border: 1px solid #00ff9d; color: #00ff9d;
        }

        .keypad-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(0, 255, 157, 0.2);
            color: #00ff9d; border-radius: 8px; font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem; padding: 12px 0; cursor: pointer;
        }
        .keypad-btn:active { background: #00ff9d; color: #050508; transform: scale(0.95); }
        .keypad-btn.op { background: rgba(0, 255, 157, 0.15); color: #fff; }
        .keypad-btn.skip { background: rgba(255, 196, 0, 0.1); color: #ffc400; border-color: #ffc400; font-size: 0.75rem; line-height: 1.1; }

        #timer-bar { transition: width 0.1s linear; }
        .hidden { display: none !important; }

        @keyframes fillVertical { from { height: 0%; } to { height: var(--final-height); } }
        .animate-fill-up { animation: fillVertical 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        .rank-label { position: absolute; right: 110%; transform: translateY(-50%); font-size: 0.7rem; color: #4b5563; }
        .rank-label.active { color: #00ff9d; font-weight: bold; }
        
        /* Cheat Alert Modal Styling */
        #cheat-modal {
            border-color: #ff4d4d !important;
            box-shadow: 0 0 40px rgba(255, 77, 77, 0.4) !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

            <div id="modal-text" class="text-white mb-8 text-left space-y-3 text-sm leading-relaxed overflow-y-auto max-h-[60vh] scrollbar-hide"></div>
            <button id="modal-close-btn" class="btn-action w-full py-4 rounded-lg orbitron">접속 승인</button>

    <div id="game-container" class="w-full max-w-2xl z-10">
        <!-- Start Screen -->
        <div id="start-screen" class="cyber-panel p-10 text-center">
            <div class="mb-6 flex justify-center">
                <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#00ff9d" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            </div>
            <h1 class="text-5xl font-bold mb-4 orbitron text-white">CODE BREAKER</h1>
            <p class="text-xl text-green-400 mb-8 font-medium">연립방정식 보안 시스템 해킹</p>
            <div class="flex flex-col gap-4 max-w-sm mx-auto">
                <button id="start-btn" class="btn-action px-10 py-5 rounded-full text-xl orbitron">시스템 접속</button>
                <button id="view-rank-btn" class="btn-secondary px-10 py-3 rounded-full text-lg orbitron">글로벌 랭킹</button>
            </div>
        </div>

        <!-- Main Game Screen -->
        <div id="game-screen" class="hidden cyber-panel p-6">
            <div class="flex justify-between items-center mb-4">
                <div class="text-left"><p class="text-[10px] uppercase text-gray-500 orbitron">Rank</p><p id="rank-display" class="font-bold text-white text-sm">브론즈 해커</p></div>
                <div class="text-center"><p id="score-display" class="text-3xl font-bold orbitron text-green-400">0000</p></div>
                <div class="text-right"><p class="text-[10px] uppercase text-gray-500 orbitron">Level</p><p id="level-display" class="text-lg font-bold text-white orbitron">1</p></div>

                <div class="w-full bg-gray-900 h-1.5 rounded-full overflow-hidden border border-green-900/30">

                </div>
                <div class="flex justify-between text-[10px] text-gray-500 mt-1 orbitron"><span>SECURE CONNECTION</span><span id="timer-text">120s</span></div>
            </div>

            <!-- Problem Area with Obfuscation -->
            <div id="problem-area" class="text-center mb-6 py-6 bg-black/50 rounded-xl border border-white/5 relative">
                <div id="equation-display" class="space-y-4"></div>
            </div>

            <div id="choice-container" class="grid grid-cols-2 gap-3 hidden"></div>

            <div id="input-container" class="hidden">
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div class="relative"><label class="absolute -top-2.5 left-3 bg-[#0a0a14] px-1 text-[9px] text-green-400 orbitron">X_CODE</label><input type="text" id="input-x" readonly class="w-full bg-transparent border border-gray-700 rounded-lg p-3 text-2xl text-center text-white focus:outline-none focus:border-green-400 cursor-pointer" placeholder="?"></div>
                    <div class="relative"><label class="absolute -top-2.5 left-3 bg-[#0a0a14] px-1 text-[9px] text-green-400 orbitron">Y_CODE</label><input type="text" id="input-y" readonly class="w-full bg-transparent border border-gray-700 rounded-lg p-3 text-2xl text-center text-white focus:outline-none focus:border-green-400 cursor-pointer" placeholder="?"></div>
                </div>
                <div id="hacker-keypad" class="grid grid-cols-4 gap-2 mb-4">
                    <button class="keypad-btn" onclick="handleKey('7')">7</button><button class="keypad-btn" onclick="handleKey('8')">8</button><button class="keypad-btn" onclick="handleKey('9')">9</button><button class="keypad-btn op" onclick="handleKey('del')">⌫</button>
                    <button class="keypad-btn" onclick="handleKey('4')">4</button><button class="keypad-btn" onclick="handleKey('5')">5</button><button class="keypad-btn" onclick="handleKey('6')">6</button><button class="keypad-btn op" onclick="handleKey('-')">-</button>
                    <button class="keypad-btn" onclick="handleKey('1')">1</button><button class="keypad-btn" onclick="handleKey('2')">2</button><button class="keypad-btn" onclick="handleKey('3')">3</button><button class="keypad-btn op" onclick="handleKey('.')">.</button>
                    <button class="keypad-btn op" onclick="handleKey('/')">/</button><button class="keypad-btn" onclick="handleKey('0')">0</button>
                    <button class="keypad-btn skip" onclick="handleSkip()">노드<br>재구축</button>
                    <button id="submit-btn" class="keypad-btn bg-green-500 !text-black !font-bold">OK</button>
                </div>
            </div>
            <div id="msg-box" class="text-center h-4 text-xs font-bold opacity-0 transition-opacity"></div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden cyber-panel p-8 text-center overflow-hidden">
            <h2 class="text-2xl font-bold mb-1 orbitron text-red-500">SYSTEM DISCONNECTED</h2>
            <p id="final-rank-text" class="text-xl font-bold text-white mb-6">당신의 계급은 브론즈 해커입니다.</p>
            <div class="flex items-center justify-around mb-8 h-64">
                <div class="text-left space-y-4">
                    <div class="p-4 bg-white/5 rounded-xl border border-white/10 w-32"><p class="text-[10px] text-gray-500 uppercase orbitron">Final Level</p><p id="final-level" class="text-2xl font-bold text-white">0</p></div>
                    <div class="p-4 bg-white/5 rounded-xl border border-white/10 w-32"><p class="text-[10px] text-gray-500 uppercase orbitron">Final Score</p><p id="final-score" class="text-2xl font-bold text-green-400">0</p></div>
                </div>
                <div class="relative w-4 bg-gray-900 h-full rounded-full border border-white/10">
                    <div id="gauge-bar" class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-green-900 to-green-400 rounded-full shadow-[0_0_15px_#00ff9d]" style="height: 0%;"></div>
                    <div class="rank-label" style="bottom: 95%;">Challenger</div><div class="rank-label" style="bottom: 80%;">Master</div><div class="rank-label" style="bottom: 65%;">Diamond</div><div class="rank-label" style="bottom: 50%;">Platinum</div><div class="rank-label" style="bottom: 35%;">Gold</div><div class="rank-label" style="bottom: 20%;">Silver</div><div class="rank-label" style="bottom: 5%;">Bronze</div>
                </div>
            </div>
            <div id="save-ranking-section" class="mb-8">
                <div class="flex gap-2 max-w-sm mx-auto">
                    <input type="text" id="hacker-name" maxlength="10" class="flex-1 bg-black/50 border border-gray-700 rounded p-3 text-white text-center focus:outline-none focus:border-green-400" placeholder="해커 닉네임">
                    <button id="save-btn" class="btn-action px-6 py-3 rounded text-sm whitespace-nowrap">기록 등록</button>
                </div>
            </div>
            <button id="restart-btn" class="btn-secondary w-full py-4 rounded-xl orbitron text-xl">메인 프레임 재접속</button>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, query, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    // Firebase Config (기존 설정 유지)
    const firebaseConfig = {
        apiKey: "AIzaSyDMcRf_D4ajjJWxaHS98-fX-CWHJCBHDAk",
        authDomain: "duru001-b5129.firebaseapp.com",
        databaseURL: "https://duru001-b5129-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "duru001-b5129",
        storageBucket: "duru001-b5129.firebasestorage.app",
        messagingSenderId: "196539259225",
        appId: "1:196539259225:web:74bc126eb12d6f1c481448",
        measurementId: "G-J5ZNLLLQ3E"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = 'equation-breaker-v10';
    let user = null;

    const bgm = document.getElementById('bgm-audio');
    let isMusicManualPaused = false; 

    window.toggleMusic = () => {
        if (bgm.paused) { bgm.play().catch(()=>{}); isMusicManualPaused = false; document.getElementById('music-on-icon').classList.add('hidden'); document.getElementById('music-off-icon').classList.remove('hidden'); }
        else { bgm.pause(); isMusicManualPaused = true; document.getElementById('music-on-icon').classList.remove('hidden'); document.getElementById('music-off-icon').classList.add('hidden'); }
        updateMusicIcons();
    };

    function updateMusicIcons() {
        if(bgm.paused) { document.getElementById('music-on-icon').classList.add('hidden'); document.getElementById('music-off-icon').classList.remove('hidden'); }
        else { document.getElementById('music-on-icon').classList.remove('hidden'); document.getElementById('music-off-icon').classList.add('hidden'); }
    }

    onAuthStateChanged(auth, (u) => { user = u; });
    signInAnonymously(auth);

    // --- STREAMING_CHUNK:Defining Game State Variables... ---
    let score = 0, level = 1, timeLeft = 120, currentMaxTime = 120, timerInterval;
    let currentAnswers = { x: 0, y: 0 }, isPaused = false, focusedInputId = 'input-x', lastProblemKey = "";

    const equationDisplay = document.getElementById('equation-display');
    const choiceContainer = document.getElementById('choice-container');
    const inputContainer = document.getElementById('input-container');

    // --- STREAMING_CHUNK:Handling Anti-Cheat Logic... ---
    // 2. JavaScript 이탈 감지 (Visibility API)
    const cheatModal = document.getElementById('cheat-warning-modal');
    const cheatCloseBtn = document.getElementById('cheat-close-btn');

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            // 브라우저 탭이 바뀌거나 오버레이(서클 투 서치 등)가 실행되면 발생
            isPaused = true; // 게임 타이머 일시정지
            cheatModal.classList.remove('hidden');
        }
    });

    cheatCloseBtn.onclick = () => {
        cheatModal.classList.add('hidden');
        isPaused = false; // 게임 재개
    };

    // 추가 보안: 우클릭 방지
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // --- STREAMING_CHUNK:Defining Anti-AI Encryption Logic... ---
    function obfText(text) {
        const container = document.createElement('div');
        container.className = 'obf-container';
        text.split('').forEach(char => {
            const span = document.createElement('span');
            span.className = 'obf-char';
            span.setAttribute('data-v', char);
            const noise = document.createElement('span');
            noise.className = 'noise';
            noise.innerText = Math.random().toString(36).substring(7);
            container.appendChild(span);
            container.appendChild(noise);
        });
        return container.outerHTML;
    }

    // --- STREAMING_CHUNK:Math Problem Generator Core... ---
    function getNonZeroRand(min, max) { let v; do { v = Math.floor(Math.random() * (max - min + 1)) + min; } while (v === 0); return v; }

    function generateProblem() {
        if (level <= 12) currentMaxTime = 120; else currentMaxTime = Math.max(10, 120 - (level - 12) * 5);
        timeLeft = currentMaxTime;
        actualGenerate();
    }

    function actualGenerate() {
        let x, y, probKey;
        do { 
            const range = 4 + Math.floor(level / 5); 
            x = getNonZeroRand(-range, range); y = getNonZeroRand(-range, range); 
            probKey = `${level}_${x}_${y}`; 
        } while (probKey === lastProblemKey);
        lastProblemKey = probKey; currentAnswers = { x, y };

        equationDisplay.innerHTML = '';
        if (level <= 3) generateLevel1_3(x, y);
        else if (level <= 6) generateLevelBasicSim(x, y);
        else if (level <= 9) generateLevelParentheses(x, y);
        else if (level <= 12) generateLevelComplex(x, y);
        else generateLevelExtreme(x, y);
    }

    function renderEquation(eq1, eq2 = null) {
        equationDisplay.innerHTML = obfText(eq1);
        if (eq2) {
            const br = document.createElement('div'); br.className = 'h-2';
            equationDisplay.appendChild(br);
            const eq2Node = document.createElement('div');
            eq2Node.innerHTML = obfText(eq2);
            equationDisplay.appendChild(eq2Node);
        }
    }

    function fmtCoeff(coeff, v, first = false) {
        if (coeff === 0) return "";
        let s = coeff > 0 ? (first ? "" : " + ") : (first ? "-" : " - ");
        let val = Math.abs(coeff);
        let d = val === 1 ? "" : (Number.isInteger(val) ? val : Number(val.toFixed(1)));
        return `${s}${d}${v}`;
    }

    // --- STREAMING_CHUNK:Level Generators... ---
    function generateLevel1_3(ansX, ansY) {
        let a = getNonZeroRand(1, 4), b = getNonZeroRand(1, 4);
        let c = (a * ansX + b * ansY);
        renderEquation(`${fmtCoeff(a, 'x', true)}${fmtCoeff(b, 'y')} = ${c}`);
        choiceContainer.innerHTML = ''; choiceContainer.classList.remove('hidden'); inputContainer.classList.add('hidden');
        const choices = [{x: ansX, y: ansY}];
        while (choices.length < 4) {
            const rx = ansX + getNonZeroRand(-3, 3), ry = ansY + getNonZeroRand(-3, 3);
            if (!choices.some(ch => ch.x === rx && ch.y === ry)) choices.push({x: rx, y: ry});
        }
        choices.sort(() => Math.random() - 0.5).forEach(ch => {
            const btn = document.createElement('button');
            btn.className = 'keypad-btn py-3 rounded-lg orbitron text-sm font-bold';
            btn.innerText = `(${ch.x}, ${ch.y})`;
            btn.onclick = () => checkAnswer(ch.x, ch.y);
            choiceContainer.appendChild(btn);
        });
    }

    function generateLevelBasicSim(ansX, ansY) {
        let a, b, d, e;
        do { a = getNonZeroRand(1, 3); b = getNonZeroRand(-3, 3); d = getNonZeroRand(1, 3); e = getNonZeroRand(-3, 3); } while (a * e === b * d);
        renderEquation(`${fmtCoeff(a, 'x', true)}${fmtCoeff(b, 'y')} = ${a * ansX + b * ansY}`, 
                       `${fmtCoeff(d, 'x', true)}${fmtCoeff(e, 'y')} = ${d * ansX + e * ansY}`);
        setupInputMode();
    }

    function generateLevelParentheses(ansX, ansY) {
        let a = getNonZeroRand(2, 3), k = getNonZeroRand(-2, 2);
        let eq1 = `${a}(x ${k > 0 ? '+' : '-'} ${Math.abs(k)}) + y = ${a * (ansX + k) + ansY}`;
        renderEquation(eq1, `x - y = ${ansX - ansY}`);
        setupInputMode();
    }

    function generateLevelComplex(ansX, ansY) {
        let den = [2, 5][Math.floor(Math.random() * 2)];
        renderEquation(`x/${den} + y = ${Number((ansX / den + ansY).toFixed(2))}`, `x + y = ${ansX + ansY}`);
        setupInputMode();
    }

    function generateLevelExtreme(ansX, ansY) {
        let a = 0.5, k = getNonZeroRand(-2, 2), den = 2;
        renderEquation(`0.5(x ${k >= 0 ? '+' : '-'} ${Math.abs(k)}) + y = ${Number((a * (ansX + k) + ansY).toFixed(2))}`, `x/${den} - y = ${Number((ansX / den - ansY).toFixed(2))}`);
        setupInputMode();
    }

    function setupInputMode() {
        choiceContainer.classList.add('hidden'); inputContainer.classList.remove('hidden');
        document.getElementById('input-x').value = ''; document.getElementById('input-y').value = '';
        focusedInputId = 'input-x'; updateInputStyles();
    }

    function updateInputStyles() {
        document.getElementById('input-x').style.borderColor = focusedInputId === 'input-x' ? '#00ff9d' : '#374151';
        document.getElementById('input-y').style.borderColor = focusedInputId === 'input-y' ? '#00ff9d' : '#374151';
    }

    // --- STREAMING_CHUNK:Game Controls and Handlers... ---
    window.handleKey = (key) => {
        if (isPaused) return;
        const input = document.getElementById(focusedInputId);
        if (key === 'del') input.value = input.value.slice(0, -1);
        else if (key === 'clear') input.value = '';
        else { if ((key === '.' || key === '/') && input.value.includes(key)) return; input.value += key; }
    };

    window.handleSkip = () => { if (isPaused) return; showMessage("보안 노드 재구축 중..."); actualGenerate(); };

    function checkAnswer(xi, yi) {
        if (isPaused) return;
        const parseVal = (v) => { if(typeof v !== 'string') v = v.toString(); if(v.includes('/')) { let p = v.split('/'); return parseFloat(p[0])/parseFloat(p[1]); } return parseFloat(v); };
        const xv = parseVal(xi), yv = parseVal(yi);
        if (isNaN(xv) || isNaN(yv)) return;
        if (Math.abs(xv - currentAnswers.x) < 0.01 && Math.abs(yv - currentAnswers.y) < 0.01) {
            score += 100 + (timeLeft * 5); level += 1; generateProblem(); updateUI();
            showMessage("접근 승인!");
        } else { timeLeft -= 10; showMessage("접근 거부!", true); if (timeLeft <= 0) endGame(); }
    }

    function showMessage(text, isError = false) {
        const msg = document.getElementById('msg-box');
        msg.innerText = text; msg.style.color = isError ? '#ff4d4d' : '#00ff9d'; msg.style.opacity = "1";
        setTimeout(() => msg.style.opacity = "0", 2000);
    }

    function updateUI() {
        document.getElementById('score-display').innerText = Math.floor(score).toString().padStart(4, '0');
        document.getElementById('level-display').innerText = level;
        const ranks = ["브론즈", "실버", "골드", "플레티넘", "다이아", "마스터", "챌린저"];
        let rIdx = Math.min(6, Math.floor((level - 1) / 3));
        document.getElementById('rank-display').innerText = ranks[rIdx] + " 해커";
    }

    const startTimer = () => {
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (isPaused) return;
            timeLeft -= 0.1;
            const pct = (timeLeft / currentMaxTime) * 100;
            document.getElementById('timer-bar').style.width = `${pct}%`;
            document.getElementById('timer-text').innerText = `${Math.ceil(timeLeft)}s`;
            if (timeLeft <= 0) endGame();
        }, 100);
    };

    const endGame = () => {
        clearInterval(timerInterval);
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('result-screen').classList.remove('hidden');
        document.getElementById('final-score').innerText = Math.floor(score);
        document.getElementById('final-level').innerText = level;
        const ph = Math.min(100, Math.max(5, (level / 20) * 100));
        document.getElementById('gauge-bar').style.setProperty('--final-height', `${ph}%`);
        document.getElementById('gauge-bar').style.height = `${ph}%`;
    };

    function showPopup(html, callback) {
        isPaused = true; document.getElementById('modal-text').innerHTML = html;
        document.getElementById('instruction-modal').classList.remove('hidden');
        document.getElementById('modal-close-btn').onclick = () => {
            if (!isMusicManualPaused) bgm.play().catch(()=>{});
            document.getElementById('instruction-modal').classList.add('hidden');
            isPaused = false; if (callback) callback();
        };
    }

    // --- STREAMING_CHUNK:Firebase Ranking Logic... ---
    document.getElementById('save-btn').onclick = async () => {
        const name = document.getElementById('hacker-name').value.trim();
        if (!name || !user) return;
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'rankings', user.uid), { name, score: Math.floor(score), level, uid: user.uid, timestamp: Date.now() });
        document.getElementById('save-ranking-section').innerHTML = '<p class="text-green-400">전송 완료</p>';
    };

    document.getElementById('start-btn').onclick = () => {
        const guide = `<div class='space-y-2'>
            <p>1. 시스템을 해킹하여 연립방정식을 푸십시오.</p>
            <p>2. 모든 정답은 <strong>정수</strong>입니다.</p>
            <p>3. 레벨 1~3은 선택, 4부터는 직접 입력입니다.</p>
            <p>4. 13레벨부터는 매 단계 제한 시간이 줄어듭니다.</p>
        </div>`;
        showPopup(guide, () => { generateProblem(); updateUI(); startTimer(); document.getElementById('start-screen').classList.add('hidden'); document.getElementById('game-screen').classList.remove('hidden'); });
    };

    document.getElementById('input-x').addEventListener('click', () => { focusedInputId = 'input-x'; updateInputStyles(); });
    document.getElementById('input-y').addEventListener('click', () => { focusedInputId = 'input-y'; updateInputStyles(); });
    document.getElementById('submit-btn').onclick = () => { checkAnswer(document.getElementById('input-x').value, document.getElementById('input-y').value); };
    document.getElementById('restart-btn').onclick = () => location.reload();
</script>
</body>
</html>
